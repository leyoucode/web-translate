<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="main-header">
      <div class="logo-area">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2"/>
          <path d="M8 12H16M12 8V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>Web Translate</h1>
      </div>
      <div class="status-badge" id="ollamaStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">正在连接...</span>
      </div>
    </header>

    <!-- Main Actions -->
    <section class="action-section">
      <button class="btn btn-primary" id="translateBtn" disabled>
        <span class="btn-icon">⚡</span>
        <span class="btn-text">翻译此页面</span>
      </button>
      <button class="btn btn-secondary" id="toggleBtn">
        <span class="btn-text">隐藏译文</span>
      </button>
    </section>

    <!-- Settings Cards -->
    <main class="settings-grid">
      <!-- Mode Card -->
      <div class="card">
        <div class="card-label">显示方式</div>
        <div class="segmented-control mode-options">
          <button class="segment active" data-mode="bilingual">双语对照</button>
          <button class="segment" data-mode="replace">替换原文</button>
        </div>
      </div>

      <!-- Selection Card -->
      <div class="card">
        <div class="card-label">划词交互</div>
        <div class="segmented-control mode-options">
          <button class="segment" data-select="auto">自动翻译</button>
          <button class="segment active" data-select="menu">右键菜单</button>
        </div>
      </div>
    </main>

    <!-- Footer / Status Area -->
    <footer class="info-footer">
      <div class="progress-container" id="progress" style="display:none"></div>
      <div class="error-container" id="errorText" style="display:none"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
